<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- Brand typefaces (Sora for headings/numbers and the wordmark, Plus Jakarta Sans for text) are
         bundled in /fonts and declared in index.css. The two used on every screen are preloaded so text
         does not jump when they arrive. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1b2d" />
    <meta name="description" content="Trackwyze - Complete business tracking platform for smart entrepreneurs. Track sales, manage ad expenses, and maximize profits with intelligent insights." />
    <meta name="keywords" content="business tracking, sales management, profit analysis, ad expenses, Kenya business, M-Pesa payments" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Trackwyze" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trackwyze" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#0f1b2d" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon.png" />
    
    <!-- Manifest -->
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/icons/favicon-32.png" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trackwyze - Track Smart. Profit Wise." />
    <meta property="og:description" content="Complete business tracking platform for smart entrepreneurs. Track sales, manage suppliers, monitor ad expenses, and maximize profits." />
    <meta property="og:site_name" content="Trackwyze" />
    <meta property="og:url" content="https://trackwyze.com" />
    <meta property="og:image" content="https://trackwyze.com/logo/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trackwyze - Track Smart. Profit Wise." />
    <meta name="twitter:description" content="Complete business tracking platform for smart entrepreneurs." />
    <meta name="twitter:image" content="https://trackwyze.com/logo/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://trackwyze.com/landing" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Trackwyze",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Business tracking platform for small and growing businesses — sales, expenses, inventory, customers, suppliers, and AI-assisted insights.",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "KES",
          "price": "500"
        }
      }
    </script>

    <title>Trackwyze - Track Smart. Profit Wise.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
